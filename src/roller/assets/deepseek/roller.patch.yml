# Additions to the selected native SDK profile. Tool plugins and the agent loop
# remain under dsh ownership; no tool allowlist is imposed here.
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: llm-deepseek
  config:
    models: !!js "[{id: process.env.ROLLER_DEEPSEEK_MODEL, contextWindow: Number(process.env.DSH_CONTEXT_WINDOW), maxTokens: Number(process.env.ROLLER_DEEPSEEK_OUTPUT_TOKENS)}]"
    retryPolicy:
      mode: normal
      maxRetries: 0
- insert:
    - id: roller-request-journal
      name: /roller/deepseek_journal.mjs
