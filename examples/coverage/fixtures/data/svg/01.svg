<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">品类退货率对比</title>
  <desc id="desc">柱状图展示服装、家电、家居、数码配件的退货率。</desc>
  <rect width="720" height="420" fill="#fff"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">品类退货率对比</text>
  <text x="360" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555">单位：订单百分比，越低越好</text>
  <line x1="80" y1="350" x2="660" y2="350" stroke="#333"/>
  <line x1="80" y1="90" x2="80" y2="350" stroke="#333"/>
  <g font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="125" y="166" width="70" height="184" fill="#e15759"/><text x="160" y="158">8.5%</text><text x="160" y="378">服装</text>
    <rect x="255" y="259" width="70" height="91" fill="#59a14f"/><text x="290" y="251">4.2%</text><text x="290" y="378">家电</text>
    <rect x="385" y="268" width="70" height="82" fill="#76b7b2"/><text x="420" y="260">3.8%</text><text x="420" y="378">家居</text>
    <rect x="515" y="99" width="70" height="251" fill="#f28e2b"/><text x="550" y="91">11.6%</text><text x="550" y="378">数码配件</text>
  </g>
</svg>
