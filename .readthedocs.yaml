# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - pip install -r docs/requirements-docs.txt
    - DOCS_LANG=en sphinx-build -b html -c docs -D language=en docs/en $READTHEDOCS_OUTPUT/html
    - DOCS_LANG=zh sphinx-build -b html -c docs -D language=zh_CN docs/zh $READTHEDOCS_OUTPUT/html/zh
